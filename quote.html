<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review quote · QuoteNest</title><meta name="supabase-url" content="YOUR_SUPABASE_PROJECT_URL"><meta name="supabase-anon-key" content="YOUR_SUPABASE_ANON_KEY"><style>
:root{font-family:Inter,system-ui,Arial;color:#eaf0ff;background:#07111f}*{box-sizing:border-box}body{margin:0;padding:28px 16px}.wrap{max-width:720px;margin:5vh auto;background:#101e32;border:1px solid #263b59;border-radius:22px;padding:28px}.brand{font-weight:800;letter-spacing:.12em;color:#70b7ff;font-size:13px}.muted{color:#9eafc8}.total{font-size:30px;font-weight:800;margin:22px 0}.line{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid #2a3a51}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;margin:8px 8px 0 0}.yes{background:#55d6a1;color:#09251b}.no{background:#ff8792;color:#351015}textarea{width:100%;min-height:90px;border-radius:10px;padding:12px;background:#0a1728;color:white;border:1px solid #344966}#msg{margin-top:16px;color:#a9c7ee}</style></head><body><main class="wrap"><div class="brand">QUOTENEST · CUSTOMER REVIEW</div><h1 id="title">Loading your quote…</h1><p class="muted" id="business"></p><div id="items"></div><div class="total" id="total"></div><p class="muted" id="status"></p><label for="comment">Comment (optional)</label><textarea id="comment" placeholder="Add a note for the business"></textarea><div><button class="btn yes" onclick="respond('Approved')">Approve quote</button><button class="btn no" onclick="respond('Declined')">Decline quote</button></div><p id="msg">This page is a quote review, not a payment page.</p></main><script>
const token=new URLSearchParams(location.search).get('token');let endpoint='',quote=null;
async function load(){try{if(!token||!/^[a-f0-9]{64}$/.test(token))throw Error('This quote link is invalid.');let cfg=JSON.parse(localStorage.getItem('quotenest_supabase_config_v1')||'{}');endpoint=(document.querySelector('meta[name="supabase-url"]')?.content||'').replace('YOUR_SUPABASE_PROJECT_URL','')||cfg.url||'';let anon=(document.querySelector('meta[name="supabase-anon-key"]')?.content||'').replace('YOUR_SUPABASE_ANON_KEY','')||cfg.key||'';if(!endpoint||!anon)throw Error('The public quote page has not been configured.');let r=await fetch(endpoint+'/functions/v1/public-quote?token='+encodeURIComponent(token),{headers:{apikey:anon,Authorization:'Bearer '+anon}});let d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load quote.');quote=d.quote;document.getElementById('title').textContent=quote.title;document.getElementById('business').textContent='Prepared by '+(quote.businesses?.name||'QuoteNest');document.getElementById('items').innerHTML=(quote.quote_items||[]).map(i=>'<div class="line"><span>'+escapeHtml(i.description)+' · '+i.quantity+' × '+Number(i.unit_price).toFixed(2)+'</span><strong>'+Number(i.line_total).toFixed(2)+' '+escapeHtml(quote.currency)+'</strong></div>').join('');document.getElementById('total').textContent='Total: '+Number(quote.total).toFixed(2)+' '+quote.currency;document.getElementById('status').textContent='Status: '+quote.status;if(quote.status!=='Sent'){document.querySelectorAll('button').forEach(b=>b.disabled=true);document.getElementById('msg').textContent='This quote is no longer awaiting a response.'}}catch(e){document.getElementById('title').textContent='Quote unavailable';document.getElementById('msg').textContent=e.message}}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function respond(decision){try{let cfg=JSON.parse(localStorage.getItem('quotenest_supabase_config_v1')||'{}');let anon=(document.querySelector('meta[name="supabase-anon-key"]')?.content||'').replace('YOUR_SUPABASE_ANON_KEY','')||cfg.key||'';if(!endpoint||!anon)throw Error('Quote page is not configured.');let r=await fetch(endpoint+'/functions/v1/respond-to-quote',{method:'POST',headers:{'Content-Type':'application/json',apikey:anon,Authorization:'Bearer '+anon},body:JSON.stringify({token,decision,comment:document.getElementById('comment').value})});let d=await r.json();if(!r.ok)throw Error(d.error||'Could not submit response.');document.getElementById('msg').textContent='Thank you. Your response has been recorded.';document.querySelectorAll('button').forEach(b=>b.disabled=true)}catch(e){document.getElementById('msg').textContent=e.message}}
load();</script></body></html>
